site_name: LLM Wiki
docs_dir: wiki
site_dir: site

# raw/ is three git symlinks pointing at local source documents. They resolve
# on Andreas's machine and nowhere else, so the CI build crashed walking into
# them. Excluding is right regardless: the targets are source PDFs and must not
# be published. The .jsonl ledgers are machine state, not pages.
exclude_docs: |
  raw/
  *.jsonl
  *.canvas

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Log: log.md
